<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JK Saloon - Admin Login</title>
<link rel="stylesheet" href="admin-login.css">
</head>
<body>
<div class="login-container">
  <div class="login-box">
    <div class="logo">JK</div>
    <h1>JK Saloon</h1>
    <p class="admin-title">Owner Admin Login</p>
    <form id="adminLoginForm">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
      </div>
      <button type="submit">Login</button>
      <p id="loginMessage"></p>
    </form>
    <a href="./index.html" class="back-link">← Back to JK Saloon</a>
  </div>
</div>
<script src="admin-login.js"></script>
</body>
</html>
